# Публикация сайта: каждое изменение в main копируется в ветку gh-pages,
# из которой GitHub Pages показывает сайт.
name: Публикация на GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Обновить ветку gh-pages
        run: git push origin HEAD:gh-pages --force
